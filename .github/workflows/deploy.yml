name: Build and deploy city
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install main dependencies
        run: npm install --no-audit --no-fund
      - name: Build current published city
        run: npm run build
      - name: Verify required scene asset
        run: test -s public/cidade-master.webp
      - name: Checkout experimental 2D city
        uses: actions/checkout@v4
        with:
          ref: feat/cidade-2d-interativa
          path: preview-src
      - name: Install preview dependencies
        working-directory: preview-src
        run: npm install --no-audit --no-fund
      - name: Build preview for subdirectory
        working-directory: preview-src
        run: |
          npx tsc -b
          npx vite build --base=/portfolio-cidade/preview/
      - name: Include preview in published site
        run: |
          mkdir -p dist/preview
          cp -a preview-src/dist/. dist/preview/
          test -s dist/preview/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
